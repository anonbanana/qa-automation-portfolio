name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # situs latihan di-host di Heroku free tier — sering tertidur.
      # Bangunkan dulu semua halaman yang diuji sebelum menjalankan test.
      - name: Warm up target site
        run: |
          for path in login checkboxes dropdown inputs add_remove_elements/ javascript_alerts; do
            echo "warming: $path"
            for i in 1 2 3 4 5; do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "https://the-internet.herokuapp.com/$path" || echo "000")
              echo "  attempt $i: $code"
              if [ "$code" = "200" ]; then
                break
              fi
              sleep 15
            done
          done

      - name: Run tests
        run: npx playwright test

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
